[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "scantext"
version = "1.0.0"
description = "スキャンした書類 (JPG / PDF) をオフラインで文字起こしするアプリ"
requires-python = ">=3.10"
dependencies = [
    "pymupdf>=1.24,<2",  # 2.0 は使わない大きなレイアウト解析モデルを読み込むため
    "pytesseract>=0.3.10",
    "pillow>=10.0",
    "tkinterdnd2>=0.4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
scantext = "scantext.__main__:main"

[tool.setuptools]
packages = ["scantext"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "tesseract: 実際の Tesseract (日本語データ入り) が必要なテスト",
    "gui: 画面 (ディスプレイ) が必要なテスト",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]
